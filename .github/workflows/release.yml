name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag matches the version in Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag is $GITHUB_REF_NAME, but Cargo.toml has $v"; exit 1; }

  # Ubuntu 24.04 on purpose: the .deb needs a glibc no newer than the build machine's,
  # and 24.04 has glibc 2.39, enough for Ubuntu 24.04+ and Debian 13+.
  build-deb:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev
      - run: cargo test --locked
      - run: make deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb
          path: target/debian/*.deb
          if-no-files-found: error

  build-win:
    needs: check-version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - run: cargo test --locked
      - name: Build zip (msvc, static CRT)
        shell: bash
        env:
          TARGET: x86_64-pc-windows-msvc
          PYTHON: python
        run: packaging/build-win.sh
      - run: packaging/smoke.sh target/windows/SocketTrail/sockettrail.exe
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: win
          path: target/windows/*.zip
          if-no-files-found: error

  release:
    needs: [build-deb, build-win]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # GitHub does not keep attestations for private repositories of a user account.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/*.deb
            dist/*.zip
      - name: CHANGELOG section for this version
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v h="## v$v" 'index($0,h)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SocketTrail $GITHUB_REF_NAME" > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: SocketTrail ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.deb
            dist/*.zip
            dist/SHA256SUMS
