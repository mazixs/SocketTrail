name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --target x86_64-pc-windows-gnu

  # 24.04 is where the release .deb is built, 26.04 is the newest image.
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - run: packaging/smoke.sh target/release/sockettrail

  # Quick check of the Windows code without Windows: mingw build and tests under Wine.
  test-wine:
    runs-on: ubuntu-26.04
    env:
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # Older Wine does not report the owner PID in the socket table, WineHQ 10+ is needed.
      # WineHQ 11 uses the new WoW64 and needs no i386 packages.
      - name: mingw-w64 and WineHQ stable
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo curl -fsSLo /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo curl -fsSLo "/etc/apt/sources.list.d/winehq-$codename.sources" "https://dl.winehq.org/wine-builds/ubuntu/dists/$codename/winehq-$codename.sources"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          sudo apt-get install -y --install-recommends winehq-stable
          wine --version
          wineboot --init
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --target x86_64-pc-windows-gnu
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - run: packaging/smoke.sh wine target/x86_64-pc-windows-gnu/release/sockettrail.exe

  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -- --include-ignored
      - run: cargo build --release
      - run: packaging/smoke.sh target/release/sockettrail.exe
        shell: bash
