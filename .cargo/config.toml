# Локальная сборка под Windows: mingw-w64 + проверка под Wine.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
runner = "wine"

# Релизная сборка на windows-runner: без зависимости от vcruntime140.dll.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
