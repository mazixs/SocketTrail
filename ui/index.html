<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SocketTrail</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f1115'/%3E%3Cpath d='M6 20h6l4-9 4 14 3-5h3' stroke='%237aa2f7' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#161a21" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1115;--panel:#161a21;--panel2:#1c2129;--hover:#222834;--line:#2a313c;--line2:#363e4b;
  --txt:#e6e9ef;--dim:#9aa4b2;
  --accent:#7aa2f7;--ok:#7bd88f;--warn:#e0af68;--hot:#f7768e;--cdn:#bb9af7;
  /* текст поверх заливки акцентом: акцент светлый -> текст темный */
  --on-accent:#0d1117;--on-hot:#1a0d10;--sel-bg:rgba(122,162,247,.16);
  --h:30px;--r:7px;--r-lg:10px;--fs:13px;--fs-s:12px;
  --ease:cubic-bezier(.22,1,.36,1);
  --z-sticky:2;--z-grip:5;--z-toast:20;
}
@media (prefers-color-scheme:light){:root{
  color-scheme:light;
  --bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f6;--hover:#e8ecf2;--line:#dde2ea;--line2:#c9d0db;
  --txt:#1a1d23;--dim:#5b6472;
  --accent:#2f5fd0;--ok:#1a7f45;--warn:#8a5a00;--hot:#c0324a;--cdn:#6b3fa0;
  /* в светлой теме акцент темный -> текст белый, иначе синее на черном сливается */
  --on-accent:#ffffff;--on-hot:#ffffff;--sel-bg:rgba(47,95,208,.10);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
 font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Ubuntu,Roboto,sans-serif;
 -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"JetBrains Mono","Ubuntu Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.app{display:grid;grid-template-columns:var(--aside,320px) 1fr;grid-template-rows:48px 1fr;height:100%}

.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;
 stroke-linecap:round;stroke-linejoin:round}

/* ---------- шапка ---------- */
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;
 background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:650;letter-spacing:-.01em;font-size:15px;display:flex;align-items:center;gap:9px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;
 box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.dot.off{background:var(--hot);box-shadow:0 0 0 3px color-mix(in srgb,var(--hot) 18%,transparent)}
.stats{display:flex;align-items:center;gap:14px;color:var(--dim);font-size:var(--fs-s);white-space:nowrap;
 min-width:0;overflow:hidden}
.stats b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}
.sep{width:1px;height:18px;background:var(--line);flex:none}
.spacer{flex:1}

/* ---------- кнопки: один размер, одна форма ---------- */
button{font:inherit;font-size:var(--fs);color:var(--txt);background:var(--panel2);border:1px solid var(--line);
 border-radius:var(--r);height:var(--h);padding:0 11px;cursor:pointer;display:inline-flex;align-items:center;
 gap:6px;white-space:nowrap;flex:none;
 transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
button:hover{background:var(--hover);border-color:var(--line2)}
button:active{transform:translateY(.5px)}
button:focus-visible,input:focus-visible,.proc:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.ghost{background:transparent;border-color:transparent;color:var(--dim)}
button.ghost:hover{background:var(--hover);color:var(--txt)}
button.icon{width:var(--h);padding:0;justify-content:center}
button.danger:hover{color:var(--hot);background:color-mix(in srgb,var(--hot) 12%,transparent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#fff)}
button.rec{background:var(--hot);border-color:var(--hot);color:var(--on-hot);font-weight:600}
button.rec:hover{background:color-mix(in srgb,var(--hot) 88%,#fff)}
button.rec .rdot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.2s infinite}
button.rec .rtime{font-variant-numeric:tabular-nums;opacity:.85;font-weight:500}

/* группа: кнопки, склеенные в одну рамку (панель действий, переключатели) */
.group{display:flex;align-items:center;flex:none;height:var(--h);border:1px solid var(--line);
 border-radius:var(--r);background:var(--panel2);padding:2px;gap:2px}
.group>button{height:100%;border:0;border-radius:calc(var(--r) - 2px);background:transparent;color:var(--dim);padding:0 9px}
.group>button:hover{background:var(--hover);color:var(--txt)}
.group>button.on{background:var(--panel);color:var(--txt);font-weight:600;
 box-shadow:0 0 0 1px var(--line2),0 1px 2px rgba(0,0,0,.18)}
.group.full{display:flex;width:100%}
.group.full>button{flex:1;justify-content:center}

/* дамп: переключатель фильтра прикреплен к самой кнопке */
.dumpctl{display:flex;align-items:center;flex:none}
.dumpctl .opt{height:var(--h);display:flex;align-items:center;gap:7px;padding:0 10px;
 border:1px solid var(--line);border-right:0;border-radius:var(--r) 0 0 var(--r);background:var(--panel2);
 color:var(--dim);font-size:var(--fs-s);cursor:pointer;user-select:none;white-space:nowrap}
.dumpctl .opt:hover{color:var(--txt)}
.dumpctl>button{border-radius:0 var(--r) var(--r) 0}

label.chk{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:var(--fs-s);cursor:pointer;
 white-space:nowrap;user-select:none;flex:none}
label.chk:hover{color:var(--txt)}
input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;margin:0;cursor:pointer}

/* ---------- поля ввода ---------- */
.field{position:relative;display:flex;align-items:center;min-width:0}
.field .ic{position:absolute;left:9px;color:var(--dim);pointer-events:none}
.field input{width:100%;height:var(--h);padding:0 10px 0 31px;background:var(--panel2);
 border:1px solid var(--line);border-radius:var(--r);color:var(--txt);font:inherit;font-size:var(--fs);outline:none;
 transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.field input::placeholder{color:var(--dim)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field input:focus-visible{outline:none}

/* ---------- левая панель ---------- */
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;
 min-height:0;position:relative}
.aside-grip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:var(--z-grip)}
.aside-grip:hover{background:var(--accent);opacity:.35}
.aside-top{display:flex;flex-direction:column;gap:8px;padding:10px 10px 8px;border-bottom:1px solid var(--line)}
.aside-row{display:flex;align-items:center;gap:8px}
.aside-row .group{flex:1}
.plist{overflow-y:auto;flex:1;padding:6px}
.proc{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;cursor:pointer;
 transition:background-color .12s var(--ease)}
.proc:hover{background:var(--hover)}
.proc.sel{background:var(--sel-bg)}
.proc.sel .nm{color:var(--accent);font-weight:600}
.proc.faint .nm{color:var(--dim)}
.proc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc .pid{color:var(--dim);font-size:11.5px;font-family:ui-monospace,"Ubuntu Mono",Menlo,Consolas,monospace;
 font-variant-numeric:tabular-nums}
.twist{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--dim);cursor:pointer;
 border-radius:4px}
.twist .ic{width:12px;height:12px;transition:transform .15s var(--ease)}
.twist.open .ic{transform:rotate(90deg)}
.twist:hover{color:var(--txt);background:var(--line)}
.twist.leaf{visibility:hidden}
.led{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none}
.led.on{background:var(--ok)}

/* ---------- метки ---------- */
.badge{flex:none;font-size:11px;line-height:18px;height:18px;min-width:18px;padding:0 6px;border-radius:9px;
 text-align:center;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
 font-variant-numeric:tabular-nums}
.badge.live{border-color:transparent;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);font-weight:600}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:9px;font-size:10.5px;
 font-weight:650;letter-spacing:.02em;white-space:nowrap;flex:none}
.t-proton,.t-ghost{background:color-mix(in srgb,var(--cdn) 17%,transparent);color:var(--cdn)}
.t-sni{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ---------- основная область ---------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.warn{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;font-size:var(--fs);
 background:color-mix(in srgb,var(--warn) 12%,var(--panel));border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.warn>.ic{color:var(--warn);margin-top:2px}
.warn b{color:var(--warn)}
.warn button{margin-left:8px;vertical-align:middle}
.warn pre{margin:6px 0 0;font-family:ui-monospace,monospace;font-size:var(--fs-s);color:var(--dim);white-space:pre-wrap}
.bar{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:50px;border-bottom:1px solid var(--line);
 background:var(--panel);flex-wrap:wrap}
.bar .field{flex:1;min-width:220px;max-width:340px}
.selinfo{color:var(--dim);font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.selinfo b{color:var(--txt);font-weight:600}

.dumps{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:var(--fs)}
.dumps .path{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.dumps .path code{background:var(--panel);border:1px solid var(--line);border-radius:6px;
 padding:3px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-s)}
.dumps table{min-width:0;width:auto;table-layout:auto}
.dumps td{padding:3px 16px 3px 0;border:0;color:var(--dim);background:none!important}
.dumps td.f{color:var(--txt);font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- таблица ---------- */
.tbl{overflow:auto;flex:1;position:relative}
table{width:100%;min-width:1040px;border-collapse:separate;border-spacing:0;font-size:var(--fs);table-layout:fixed}
th{position:sticky;top:0;z-index:var(--z-sticky);background:var(--panel2);text-align:left;height:34px;padding:0 11px;
 font-size:var(--fs-s);font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap;
 user-select:none}
th .grip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize}
th .grip::after{content:"";position:absolute;right:3px;top:9px;bottom:9px;width:1px;background:var(--line)}
th .grip:hover::after{background:var(--accent);width:2px;right:2px}
td{height:32px;padding:0 11px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle;
 overflow:hidden;text-overflow:ellipsis}
tr.dead td{opacity:.55}
tbody tr:hover td{background:var(--hover)}
tbody tr:hover.dead td{opacity:.8}
.ip{color:var(--accent);font-weight:600}
td.num{text-align:right}
th.num{text-align:right}
.st{display:inline-flex;align-items:center;height:18px;font-size:10.5px;font-weight:650;padding:0 7px;
 border-radius:9px;white-space:nowrap;letter-spacing:.02em}
.st.ESTABLISHED,.st.ACTIVE,.st.live{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.CLOSED,.st.TIME_WAIT,.st.CLOSE_WAIT,.st.FIN_WAIT1,.st.FIN_WAIT2,.st.LAST_ACK,.st.gone
 {background:color-mix(in srgb,var(--dim) 16%,transparent);color:var(--dim)}
.st.SYN_SENT,.st.NEW{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.copy{opacity:0;width:22px;height:22px;padding:0;border:0;border-radius:5px;background:transparent;color:var(--dim);
 justify-content:center}
.copy .ic{width:13px;height:13px}
tr:hover .copy,.copy:focus-visible{opacity:1}
.copy:hover{color:var(--accent);background:var(--line)}
.cell{display:flex;align-items:center;gap:6px;min-width:0}
.cell span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proto{color:var(--dim);font-size:11px;margin-left:4px}
.empty{padding:64px 20px;text-align:center;color:var(--dim)}
.empty h3{color:var(--txt);margin:0 0 6px;font-weight:600;font-size:15px}
.plist .empty{padding:28px 12px}

.toast{position:fixed;right:16px;bottom:16px;display:flex;gap:10px;align-items:flex-start;
 background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-lg);padding:11px 14px;max-width:520px;
 box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(8px);
 transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;z-index:var(--z-toast)}
.toast .ic{margin-top:2px;color:var(--ok)}
.toast.bad .ic{color:var(--hot)}
.toast.show{opacity:1;transform:none}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--line2);background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M8 13h8M8 17h5"/></symbol>
  <symbol id="i-json" viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>
<div class="app">
  <header>
    <div class="logo"><span class="dot" id="capled"></span>SocketTrail</div>
    <div class="sep"></div>
    <div class="stats">
      <span id="s-matched-wrap"><b id="s-matched">0</b> <span data-t>in view</span></span>
      <span><b id="s-stored">0</b> <span data-t>in history</span></span>
      <span><b id="s-pkts">0</b> <span data-t>packets</span></span>
      <span><span data-t>interface</span> <b id="s-if">-</b></span>
    </div>
    <div class="spacer"></div>
    <div class="dumpctl">
      <label class="opt" title="Only traffic of the selected process and its child processes stays in the file. Recording stops by itself when the process exits"><input type="checkbox" id="onlyproc" checked> <span data-t>process only</span></label>
      <button id="btn-dump" class="primary"></button>
    </div>
    <div class="group" role="toolbar" aria-label="Export">
      <button id="btn-folder" title="Dump folder and file list"><svg class="ic"><use href="#i-folder"/></svg><span data-t>Dumps</span></button>
      <button id="btn-copy" title="Copy the shown table as TSV"><svg class="ic"><use href="#i-copy"/></svg><span data-t>Copy</span></button>
      <button id="btn-html" title="Standalone HTML report"><svg class="ic"><use href="#i-report"/></svg><span data-t>Report</span></button>
      <button id="btn-export" title="Export to JSON"><svg class="ic"><use href="#i-json"/></svg>JSON</button>
    </div>
    <div class="group" id="lang" role="group" aria-label="Language" title="Language">
      <button data-l="en">EN</button>
      <button data-l="ru">RU</button>
    </div>
    <button id="btn-clear" class="ghost icon danger" title="Clear connection history" aria-label="Clear history"><svg class="ic"><use href="#i-trash"/></svg></button>
  </header>

  <aside>
    <div class="aside-top">
      <div class="field"><svg class="ic"><use href="#i-search"/></svg>
        <input id="q" placeholder="Process: name, PID, arguments" aria-label="Process search"></div>
      <div class="aside-row">
        <div class="group full filters" role="tablist">
          <button data-f="active" class="on" data-t>With traffic</button>
          <button data-f="proton">Proton</button>
          <button data-f="all" data-t>All</button>
        </div>
        <label class="chk" title="Show SocketTrail itself and its dumpcap"><input type="checkbox" id="showself"> <span data-t>self</span></label>
      </div>
    </div>
    <div class="plist" id="plist"></div>
    <div class="aside-grip" id="aside-grip" title="Drag to change the width"></div>
  </aside>

  <main>
    <div id="warn" class="warn" style="display:none"></div>
    <div class="bar">
      <div class="group" id="scope">
        <button data-s="proc" class="on" data-t>Process</button>
        <button data-s="host" data-t>Whole host</button>
      </div>
      <div class="group" id="viewmode">
        <button data-v="list" class="on" data-t>List</button>
        <button data-v="agg" data-t>By address</button>
      </div>
      <div class="field"><svg class="ic"><use href="#i-filter"/></svg>
        <input id="qc" placeholder="Domain, IP, port, ASN" aria-label="Connection filter"></div>
      <label class="chk"><input type="checkbox" id="showlocal"> <span data-t>local addresses</span></label>
      <label class="chk"><input type="checkbox" id="showselfc"> <span data-t>SocketTrail connections</span></label>
      <div class="spacer"></div>
      <span class="selinfo" id="selinfo"></span>
    </div>
    <div id="dumps" class="dumps" style="display:none"></div>
    <div class="tbl" id="tblwrap">
      <table id="tbl">
        <colgroup>
          <col data-k="time"><col data-k="state"><col data-k="dom"><col data-k="ip"><col data-k="port">
          <col data-k="net"><col data-k="proc"><col data-k="tx"><col data-k="rx">
        </colgroup>
        <thead><tr>
          <th data-k="time"><span data-t>Time</span></th><th data-k="state"><span data-t>State</span></th>
          <th data-k="dom"><span data-t>Domain / name</span></th><th data-k="ip"><span data-t>Address</span></th>
          <th data-k="port"><span data-t>Port</span></th><th data-k="net"><span data-t>Network owner</span></th>
          <th data-k="proc"><span id="th-proc"></span></th><th data-k="tx" class="num"><span data-t>Out</span></th>
          <th data-k="rx" class="num"><span data-t>In</span></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty"><h3 data-t>Nothing here yet</h3>
        <div data-t>Pick a process on the left or switch to "Whole host".</div></div>
    </div>
  </main>
</div>

const ic = id => `<svg class="ic"><use href="#i-${id}"/></svg>`;
const state = {

const DEFAULT_W = {time:84,state:118,dom:230,ip:150,port:84,net:170,proc:150,tx:84,rx:84};

/* ---------- язык: английский в разметке, русский из словаря ---------- */

const RU = {

  'Could not open the folder, path: {d}': 'Не удалось открыть папку, путь: {d}',

const t = (en, vars) => {
  const s = LANG === 'ru' && RU[en] || en;
  return vars ? s.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m) : s;
};
const loc = () => LANG === 'ru' ? 'ru-RU' : 'en-US';
// en: [одно, много], ru: [1, 2-4, 5+]
const plural = (n, en, ru) => {
  if (LANG !== 'ru') return n + ' ' + (n === 1 ? en[0] : en[1]);
  const m10 = n % 10, m100 = n % 100;
  return n + ' ' + (m10 === 1 && m100 !== 11 ? ru[0]
    : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? ru[1] : ru[2]);
};

// Надписи разметки: английские оригиналы запоминаются один раз, дальше переводятся из них.
const ATTRS = ['title', 'placeholder', 'aria-label'];
let statics = [];
function collectStatics(){
  statics = [];
  document.querySelectorAll('[data-t]').forEach(el => statics.push({el, text: el.textContent}));
  document.querySelectorAll(ATTRS.map(a => `[${a}]`).join(',')).forEach(el => {
    for (const a of ATTRS) if (el.hasAttribute(a)) statics.push({el, attr: a, text: el.getAttribute(a)});
  });
}
function applyLang(){
  document.documentElement.lang = LANG;
  for (const s of statics){
    if (s.attr) s.el.setAttribute(s.attr, t(s.text)); else s.el.textContent = t(s.text);
  }
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
}

const fmtBytes = n => !n ? '-' : n < 1024 ? n + ' ' + t('B')
  : n < 1048576 ? (n/1024).toFixed(1) + ' ' + t('KB') : (n/1048576).toFixed(2) + ' ' + t('MB');
const fmtTime = ms => new Date(ms).toLocaleTimeString(loc(), {hour12:false});
const fmtNum = v => v.toLocaleString(loc());
const esc = s => (s??'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// Связь с сервером: если SocketTrail закрыли, окно должно сказать об этом,
// а не молча показывать устаревшую таблицу.
let offline = 0;
async function api(url, opts){
  try {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (offline){ offline = 0; showOffline(false); }
    return data;
  } catch(e) {
    if (++offline >= 2) showOffline(true);
    return null;
  }
}

function showOffline(on){
  const w = $('#warn');
  w._html = '';
  if (on && elevating){
    w.innerHTML = ic('alert') + '<div>' + t('<b>Restarting as administrator.</b> The window will reconnect by itself in a few seconds.') + '</div>';
    w.style.display = '';
    w.dataset.offline = '1';
  } else if (on){
    w.innerHTML = ic('alert') + '<div>' + t('<b>Connection to SocketTrail lost.</b> The program was closed or stopped. '
      + 'The table shows the last received data. Start SocketTrail again and reload the page.') + '</div>';
    w.style.display = '';
    w.dataset.offline = '1';
    $('#capled').className = 'dot off';
  } else if (w.dataset.offline){
    elevating = false;
    delete w.dataset.offline;
    w.style.display = 'none';
  }
}

// Перезапуск с правами: новый экземпляр займет тот же порт, страница переподключится.
let elevating = false;
async function elevate(){
  const b = $('#btn-elevate');
  if (b) b.disabled = true;
  const r = await api('/api/elevate', {method:'POST'}) || {ok:false, error:t('no connection to SocketTrail')};
  if (r.ok){ elevating = true; showOffline(true); }
  else { toast(t('Restart failed: {e}', {e: esc(r.error || '')}), 'bad'); if (b) b.disabled = false; }
}

function toast(msg, kind){
  const el = $('#toast');
  el.classList.toggle('bad', kind === 'bad');
  el.innerHTML = ic(kind === 'bad' ? 'alert' : 'ok') + `<div>${msg}</div>`;
  el.classList.add('show');
  clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 5200);
}

async function copy(text, what){
  try {
    await navigator.clipboard.writeText(text);
    toast(t('Copied: {w}', {w: esc(what)}));
  } catch(e) {
    // clipboard недоступен без защищенного контекста - запасной путь через textarea
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast(t('Copied: {w}', {w: esc(what)}));
  }
}

/* ---------- ширины колонок ---------- */

function loadWidths(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('st.widths') || '{}'); } catch(e) {}
  document.querySelectorAll('#tbl colgroup col').forEach(col => {
    const k = col.dataset.k;
    col.style.width = (saved[k] || DEFAULT_W[k]) + 'px';
  });
}

function saveWidths(){
  const w = {};
  document.querySelectorAll('#tbl colgroup col').forEach(col => {
    w[col.dataset.k] = parseInt(col.style.width) || DEFAULT_W[col.dataset.k];
  });
  try { localStorage.setItem('st.widths', JSON.stringify(w)); } catch(e) {}
}

function initResizers(){
  document.querySelectorAll('#tbl thead th').forEach(th => {
    const grip = document.createElement('div');
    grip.className = 'grip';
    grip.title = 'Drag to change the width. Double click fits the content';
    th.appendChild(grip);
    const col = document.querySelector(`#tbl col[data-k="${th.dataset.k}"]`);

    grip.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      const x0 = e.clientX, w0 = col.getBoundingClientRect().width;
      const move = ev => { col.style.width = Math.max(56, w0 + ev.clientX - x0) + 'px'; };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.body.style.cursor = '';
        saveWidths();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.body.style.cursor = 'col-resize';
    });

    // двойной клик - подогнать под самое длинное значение в колонке
    grip.addEventListener('dblclick', e => {
      e.preventDefault(); e.stopPropagation();
      const idx = [...th.parentNode.children].indexOf(th);
      let max = th.scrollWidth;
      for (const tr of $('#rows').children) {
        const td = tr.children[idx];
        if (td) max = Math.max(max, td.firstElementChild ? td.firstElementChild.scrollWidth + 28 : td.scrollWidth);
      }
      col.style.width = Math.min(620, Math.max(56, max + 24)) + 'px';
      saveWidths();
    });
  });
}

function initAsideGrip(){
  const grip = $('#aside-grip');
  const saved = parseInt(localStorage.getItem('st.aside') || '0');
  if (saved) document.querySelector('.app').style.setProperty('--aside', saved + 'px');
  grip.addEventListener('mousedown', e => {
    e.preventDefault();
    const x0 = e.clientX;
    const w0 = document.querySelector('aside').getBoundingClientRect().width;
    const move = ev => {
      const w = Math.min(640, Math.max(200, w0 + ev.clientX - x0));
      document.querySelector('.app').style.setProperty('--aside', w + 'px');
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.body.style.cursor = '';
      const w = parseInt(getComputedStyle(document.querySelector('.app')).getPropertyValue('--aside'));
      try { localStorage.setItem('st.aside', w); } catch(e) {}
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    document.body.style.cursor = 'col-resize';
  });
}

/* ---------- дерево процессов ---------- */

async function loadProcs(){
  const url = `/api/procs?filter=${state.filter}&q=${encodeURIComponent($('#q').value)}`
    + `&show_self=${state.showSelf ? 1 : 0}`;
  const r = await api(url);
  if (!r) return;
  state.procs = r.procs;
  state.selected = r.selected;
  renderProcs();
}

// Строим дерево по ppid. Одноименные листья одного родителя сворачиваются в
// одну строку: у браузеров и языковых серверов таких потомков бывают десятки.
function buildTree(procs){
  const byPid = new Map(procs.map(p => [p.pid, p]));
  const kids = new Map();
  const roots = [];
  for (const p of procs){
    if (byPid.has(p.ppid) && p.ppid !== p.pid) {
      if (!kids.has(p.ppid)) kids.set(p.ppid, []);
      kids.get(p.ppid).push(p);
    } else roots.push(p);
  }
  const sort = a => a.sort((x, y) => (y.conns - x.conns) || x.name.localeCompare(y.name) || x.pid - y.pid);
  sort(roots);
  for (const v of kids.values()) sort(v);
  return {kids, roots};
}

function renderProcs(){
  const {kids, roots} = buildTree(state.procs);
  const out = [];

  const walk = (node, depth) => {
    const children = kids.get(node.pid) || [];
    const collapsed = state.collapsed.has(node.pid);
    out.push(rowHtml(node, depth, children.length, collapsed));
    if (collapsed || !children.length) return;

    // группировка одноименных листьев
    const groups = new Map();
    for (const c of children){
      const leaf = !(kids.get(c.pid) || []).length;
      const key = leaf ? 'leaf:' + c.name : 'node:' + c.pid;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    }
    for (const [key, list] of groups){
      if (key.startsWith('leaf:') && list.length > 2){
        // Пачку одноименных потомков держим свернутой: у сборщика фронтенда
        // таких бывает под две сотни, и они вытесняют из списка все остальное.
        const gid = `g${node.pid}:${list[0].name}`;
        const open = state.opened.has(gid);
        out.push(groupHtml(list, depth + 1, gid, open));
        if (open) for (const c of list) walk(c, depth + 2);
      } else {
        for (const c of list) walk(c, depth + 1);
      }
    }
  };
  for (const r of roots) walk(r, 0);

  $('#plist').innerHTML = out.join('')
    || `<div class="empty">${t('Nothing found')}</div>`;
}

function rowHtml(p, depth, nkids, collapsed){
  const sel = p.pid === state.selected ? ' sel' : '';
  const faint = p.matched ? '' : ' faint';
  const tw = nkids ? `<span class="twist${collapsed ? '' : ' open'}" data-tw="${p.pid}">${ic('chev')}</span>`
                   : '<span class="twist leaf"></span>';
  const conns = p.conns ? `<span class="badge live">${p.conns}</span>`
    : (nkids && collapsed ? `<span class="badge">${nkids}</span>` : '');
  return `<div class="proc${sel}${faint}" data-pid="${p.pid}" title="${esc(p.cmdline || p.name)}"
    style="padding-left:${4 + depth * 14}px">
    ${tw}<span class="led ${p.active ? 'on' : ''}"></span>
    <span class="nm">${esc(p.name)}</span>
    ${p.proton ? '<span class="tag t-proton">PROTON</span>' : ''}
    ${conns}<span class="pid">${p.pid}</span></div>`;
}

function groupHtml(list, depth, gid, open){
  const live = list.reduce((s, p) => s + p.conns, 0);
  return `<div class="proc faint" data-group="${esc(gid)}" style="padding-left:${4 + depth * 14}px">
    <span class="twist${open ? ' open' : ''}" data-tw="${esc(gid)}">${ic('chev')}</span>
    <span class="led ${list.some(p => p.active) ? 'on' : ''}"></span>
    <span class="nm">${esc(list[0].name)}</span>
    <span class="badge">×${list.length}</span>
    ${live ? `<span class="badge live">${live}</span>` : ''}</div>`;
}

$('#plist').addEventListener('click', async e => {
  const tw = e.target.closest('.twist');
  if (tw && tw.dataset.tw !== undefined){
    const raw = tw.dataset.tw;
    if (raw.startsWith('g')){   // пачка одноименных: по умолчанию свернута
      state.opened.has(raw) ? state.opened.delete(raw) : state.opened.add(raw);
    } else {
      const pid = +raw;
      state.collapsed.has(pid) ? state.collapsed.delete(pid) : state.collapsed.add(pid);
    }
    renderProcs();
    return;
  }
  const el = e.target.closest('.proc');
  if (!el || !el.dataset.pid) return;

  const pid = +el.dataset.pid;
  state.selected = state.selected === pid ? null : pid;
  // подсветка сразу, не дожидаясь ответа сервера
  document.querySelectorAll('.proc.sel').forEach(x => x.classList.remove('sel'));
  if (state.selected !== null) el.classList.add('sel');
  $('#rows').innerHTML = '';
  rowIndex.clear();

  await api('/api/select', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pid: state.selected})});
  refresh();
});

/* ---------- таблица ---------- */

const rowIndex = new Map(); // id -> {tr, sig}

const copyBtn = (v, label) =>
  `<button class="copy" data-copy="${esc(v)}" title="${t(label)}" aria-label="${t(label)}">${ic('copy')}</button>`;

function listRow(c){
  const dom = c.domain ? esc(c.domain) : `<span class="dim">${t('no name')}</span>`;
  const sni = c.sni ? '<span class="tag t-sni">SNI</span>' : '';
  const proc = c.pname
    ? `${esc(c.pname)} <span class="mono dim">${c.pid}</span>`
    : `<span class="tag t-ghost" title="${t('Caught by packet parsing, not in the socket table')}">${t('packets only')}</span>`;
  return [
    `<td class="mono dim">${fmtTime(c.first_seen)}</td>`,
    `<td><span class="st ${esc(c.state)}">${esc(c.state)}</span></td>`,
    `<td><div class="cell"><span class="txt" title="${esc(c.domain || '')}">${dom}</span>${sni}
       ${copyBtn(c.domain || c.remote, 'Copy name')}</div></td>`,
    `<td><div class="cell"><span class="txt mono ip">${esc(c.remote)}</span>
       ${copyBtn(c.remote, 'Copy address')}</div></td>`,
    `<td class="mono">${c.rport}<span class="proto">${c.proto}</span></td>`,
    `<td class="dim" title="${esc((c.asn || '') + ' ' + (c.owner || ''))}">${esc(c.asn || '')} ${esc(c.owner || '')}</td>`,

    `<td class="mono num">${fmtBytes(c.tx_bytes)}</td>`,
    `<td class="mono num">${fmtBytes(c.rx_bytes)}</td>`,
  ].join('');
}

function aggRow(a){
  const dom = a.domain ? esc(a.domain) : `<span class="dim">${t('no name')}</span>`;
  const sni = a.sni ? '<span class="tag t-sni">SNI</span>' : '';
  const st = a.live ? `<span class="st live">${plural(a.live, ['active', 'active'], ['активное', 'активных', 'активных'])}</span>`
                    : `<span class="st gone">${t('closed')}</span>`;
  return [
    `<td class="mono dim">${fmtTime(a.first_seen)}</td>`,
    `<td>${st}</td>`,
    `<td><div class="cell"><span class="txt" title="${esc(a.domain || '')}">${dom}</span>${sni}
       ${copyBtn(a.domain || a.remote, 'Copy name')}</div></td>`,
    `<td><div class="cell"><span class="txt mono ip">${esc(a.remote)}</span>
       ${copyBtn(a.remote, 'Copy address')}</div></td>`,
    `<td class="mono">${a.rport}<span class="proto">${a.proto}</span></td>`,
    `<td class="dim" title="${esc((a.asn || '') + ' ' + (a.owner || ''))}">${esc(a.asn || '')} ${esc(a.owner || '')}</td>`,
    `<td class="dim">${plural(a.sessions, ['session', 'sessions'], ['сессия', 'сессии', 'сессий'])}</td>`,
    `<td class="mono num">${fmtBytes(a.tx_bytes)}</td>`,
    `<td class="mono num">${fmtBytes(a.rx_bytes)}</td>`,
  ].join('');
}

// Точечное обновление: строки, которые не изменились, не трогаем совсем.
// Полная перерисовка таблицы на каждый опрос и была причиной рывков.
function renderRows(items, makeRow, sigOf){
  const tbody = $('#rows');
  const seen = new Set();
  let prev = null;
  for (const it of items){
    const id = it.id;
    seen.add(id);
    const sig = sigOf(it);
    let rec = rowIndex.get(id);
    if (!rec){
      const tr = document.createElement('tr');
      tr.innerHTML = makeRow(it);
      rec = {tr, sig};
      rowIndex.set(id, rec);
    } else if (rec.sig !== sig){
      rec.tr.innerHTML = makeRow(it);
      rec.sig = sig;
    }
    const dead = it.closed !== undefined ? it.closed : !it.live;
    rec.tr.className = dead ? 'dead' : '';
    rec.tr.title = it.lport !== undefined
      ? t('local port {p}, last activity {t}', {p: it.lport, t: fmtTime(it.last_seen)})
      : t('last activity {t}', {t: fmtTime(it.last_seen)});
    // insertBefore перемещает уже существующий узел, пересоздавать его не нужно
    const next = prev ? prev.nextSibling : tbody.firstChild;
    if (next !== rec.tr) tbody.insertBefore(rec.tr, next);
    prev = rec.tr;
  }
  for (const [id, rec] of rowIndex){
    if (!seen.has(id)){ rec.tr.remove(); rowIndex.delete(id); }
  }
}

async function refresh(){
  if (state.busy) return;
  state.busy = true;
  try {
    const url = `/api/state?scope=${state.scope}&view=${state.view}`
      + `&q=${encodeURIComponent($('#qc').value)}`
      + `&show_local=${state.showLocal ? 1 : 0}&show_self=${state.showSelf ? 1 : 0}`;
    const r = await api(url);
    if (!r) return;

    state.dump = r.dump;
    state.selected = r.selected;
    const auto = r.dump.auto_stopped;
    if (state.autoSeen === undefined) state.autoSeen = auto;
    else if (auto && auto !== state.autoSeen){
      state.autoSeen = auto;
      toast(t('Process exited, recording stopped: {p}', {p: `<span class="mono">${esc(auto)}</span>`}));
      if ($('#dumps').style.display !== 'none') renderDumps();
    }
    // В сводке shown считает адреса, а matched - соединения: подписи разные,
    // иначе "747 (показано 124)" читается как обрезанная выдача.
    const total = state.view === 'agg' && r.targets ? r.targets.total : r.stats.matched;
    $('#s-matched-wrap').innerHTML = state.view === 'agg'
      ? t('<b>{a}</b> addresses, <b>{c}</b> connections', {a: fmtNum(total), c: fmtNum(r.stats.matched)})
      : t('<b>{n}</b> in view', {n: fmtNum(r.stats.matched)})
        + (r.stats.shown < r.stats.matched ? t(', shown {n}', {n: fmtNum(r.stats.shown)}) : '');
    $('#s-stored').textContent = fmtNum(r.stats.stored);
    $('#s-pkts').textContent = fmtNum(r.stats.packets);
    $('#s-if').textContent = r.stats.iface;
    $('#capled').className = 'dot' + (r.stats.capture ? '' : ' off');
    $('#capled').title = t(r.stats.capture ? 'Packet capture is active' : 'Packet capture unavailable');

    const w = $('#warn');
    if (r.stats.capture || !r.stats.capture_hint){ w.style.display = 'none'; delete w.dataset.offline; }
    else {
      const [head, ...rest] = r.stats.capture_hint.split('\n');
      const html = ic('alert') + (r.stats.elevate
        ? `<div>${t('<b>Packet capture is off.</b> {h}', {h: esc(head)})} `
          + `<button id="btn-elevate" class="primary">${t('Restart as administrator')}</button></div>`
        : `<div>${t('<b>Packet capture is off.</b> Domains and short connections will not be shown, '
          + 'only socket polling remains. {h}', {h: esc(head)})}`
          + (rest.length ? `<pre>${esc(rest.join('\n'))}</pre>` : '') + '</div>');
      // перерисовка на каждом опросе сбивала бы наведение и нажатие кнопки
      if (w._html !== html){
        w.innerHTML = w._html = html;
        const b = $('#btn-elevate');
        if (b) b.onclick = elevate;
      }
      w.style.display = '';
    }

    const proc = state.procs.find(p => p.pid === r.selected);
    $('#selinfo').innerHTML = proc
      ? t('{name} {pid}, group of {n}', {name: esc(proc.name), pid: `<b class="mono">${proc.pid}</b>`,
          n: plural(r.group.length, ['process', 'processes'], ['процесс', 'процесса', 'процессов'])})
      : t('no process selected, showing the whole host');
    $('#selinfo').title = $('#selinfo').textContent;

    $('#th-proc').textContent = t(state.view === 'agg' ? 'Sessions' : 'Process');
    const items = state.view === 'agg' ? (r.targets ? r.targets.items : []) : r.conns;
    state.lastRows = items;
    $('#empty').style.display = items.length ? 'none' : '';

    if (state.view === 'agg'){
      renderRows(items, aggRow, a => `${a.live}|${a.sessions}|${a.tx_bytes}|${a.rx_bytes}|${a.domain}|${a.asn}`);
    } else {
      renderRows(items, listRow, c => `${c.state}|${c.tx_bytes}|${c.rx_bytes}|${c.domain}|${c.asn}|${c.pname}`);
    }

    renderDumpBtn(r.dump);
    $('#btn-dump').title = r.stats.capture ? '' : t('Packet capture unavailable, recording may not start');
  } finally {
    state.busy = false;
  }
}

function renderDumpBtn(d){
  const b = $('#btn-dump');
  let html;
  if (d && d.running){
    const s = d.started ? Math.max(0, Math.floor((Date.now() - d.started) / 1000)) : 0;
    const mmss = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    html = `<span class="rdot"></span>${t('Stop')}<span class="rtime">${mmss}</span>`;
    b.className = 'rec';
  } else {
    html = ic('rec') + t('Record dump');
    b.className = 'primary';
  }
  if (b._html !== html){ b.innerHTML = html; b._html = html; }
}

/* ---------- элементы управления ---------- */

$('#rows').addEventListener('click', e => {
  const b = e.target.closest('.copy');
  if (b) copy(b.dataset.copy, b.dataset.copy);
});

let qTimer;
$('#q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(loadProcs, 160); });
let qcTimer;
$('#qc').addEventListener('input', () => { clearTimeout(qcTimer); qcTimer = setTimeout(refresh, 160); });

document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.filters button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); state.filter = b.dataset.f; loadProcs();
});
document.querySelectorAll('#scope button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#scope button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); state.scope = b.dataset.s; hardRefresh();
});
document.querySelectorAll('#viewmode button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#viewmode button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); state.view = b.dataset.v; hardRefresh();
});
$('#showlocal').onchange = e => { state.showLocal = e.target.checked; hardRefresh(); };
$('#showselfc').onchange = e => {
  state.showSelf = e.target.checked; $('#showself').checked = e.target.checked;
  hardRefresh(); loadProcs();
};
$('#showself').onchange = e => {
  state.showSelf = e.target.checked; $('#showselfc').checked = e.target.checked;
  loadProcs(); hardRefresh();
};

function hardRefresh(){
  $('#rows').innerHTML = ''; rowIndex.clear(); refresh();
}

$('#btn-dump').onclick = async () => {
  if (state.dump && state.dump.running){
    const r = await api('/api/dump/stop', {method:'POST'}) || {};
    toast(t('Dump saved: {p}', {p: `<span class="mono">${esc(r.path || '')}</span>`}) + `<br>${fmtBytes(r.size)}`
      + ` <span class="dim">${t('(the "Dumps" button in the header opens the folder)')}</span>`
      + (r.sidecar ? `<br><span class="dim">${t('connection map: {p}', {p: esc(r.sidecar)})}</span>` : ''));
    if ($('#dumps').style.display !== 'none') renderDumps();
  } else {
    const r = await api('/api/dump/start', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({filtered: $('#onlyproc').checked && !!state.selected})})
      || {ok:false, error:t('no connection to SocketTrail')};
    toast(r.ok ? t('Recording to {p}', {p: `<span class="mono">${esc(r.path)}</span>`})
        + (r.only ? `<br><span class="dim">${t('only {w} and its child processes, recording stops by itself after it exits', {w: esc(r.only)})}</span>` : '')
      : t('Could not start recording: {e}', {e: esc(r.error || '')}), r.ok ? '' : 'bad');
  }
  refresh();
};

$('#btn-copy').onclick = () => {
  const head = LANG === 'ru'
    ? (state.view === 'agg'
      ? ['время','активных','домен','адрес','порт','протокол','сеть','сессий','исх','вх']
      : ['время','состояние','домен','адрес','порт','протокол','сеть','процесс','pid','исх','вх'])
    : (state.view === 'agg'
      ? ['time','active','domain','address','port','protocol','network','sessions','out','in']
      : ['time','state','domain','address','port','protocol','network','process','pid','out','in']);
  const lines = [head.join('\t')];
  for (const it of state.lastRows){
    lines.push(state.view === 'agg'
      ? [fmtTime(it.first_seen), it.live, it.domain || '', it.remote, it.rport, it.proto,
         `${it.asn || ''} ${it.owner || ''}`.trim(), it.sessions, it.tx_bytes, it.rx_bytes].join('\t')
      : [fmtTime(it.first_seen), it.state, it.domain || '', it.remote, it.rport, it.proto,
         `${it.asn || ''} ${it.owner || ''}`.trim(), it.pname || '', it.pid ?? '', it.tx_bytes, it.rx_bytes].join('\t'));
  }
  copy(lines.join('\n'), plural(state.lastRows.length, ['row', 'rows'], ['строка', 'строки', 'строк']));
};

// Каталог дампов лежит в домашней папке и называется так же, как репозиторий
// проекта, - показываем полный путь и открываем его по кнопке.
$('#btn-folder').onclick = () => {
  if ($('#dumps').style.display !== 'none') hideDumps(); else renderDumps();
};
function hideDumps(){
  $('#dumps').style.display = 'none';
  $('#btn-folder').classList.remove('on');
}
async function renderDumps(){
  const box = $('#dumps');
  const r = await api('/api/dumps');
  if (!r) return;
  const rows = r.files.map(f => `<tr><td class="f">${esc(f.name)}</td><td>${fmtBytes(f.size)}</td>`
    + `<td>${new Date(f.mtime).toLocaleString(loc())}</td></tr>`).join('');
  box.innerHTML = `<div class="path">${t('Dumps are saved to {d}', {d: `<code>${esc(r.dir)}</code>`})}`
    + `<button id="btn-reveal">${ic('folder')}${t('Open folder')}</button>`
    + `<button id="btn-copydir">${ic('copy')}${t('Copy path')}</button>`
    + `<span class="spacer"></span>`
    + `<button id="btn-hide" class="ghost icon" title="${t('Hide')}" aria-label="${t('Hide')}">${ic('x')}</button></div>`
    + (rows ? `<table>${rows}</table>`
            : `<div class="dim">${t('No dumps recorded yet.')}</div>`);
  box.style.display = '';
  $('#btn-folder').classList.add('on');
  $('#btn-reveal').onclick = async () => {
    const res = await api('/api/reveal', {method:'POST'});
    if (res && !res.ok) toast(t('Could not open the folder, path: {d}', {d: esc(res.dir)}), 'bad');
  };
  $('#btn-copydir').onclick = () => copy(r.dir, r.dir);
  $('#btn-hide').onclick = hideDumps;
}

$('#btn-export').onclick = () => location.href = '/api/export?scope=' + state.scope;
$('#btn-html').onclick = () => location.href = '/api/export?format=html&scope=' + state.scope;
$('#btn-clear').onclick = async () => { await api('/api/clear', {method:'POST'}); hardRefresh(); };

document.querySelectorAll('#lang button').forEach(b => b.onclick = async () => {
  if (b.dataset.l === LANG) return;
  const r = await api('/api/lang', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lang: b.dataset.l})});
  if (!r || !r.ok) return;
  LANG = r.lang;
  applyLang();
  // кеши разметки сравнивают готовый HTML: после смены языка их надо сбросить
  $('#btn-dump')._html = ''; $('#warn')._html = '';
  renderDumpBtn(state.dump);
  renderProcs();
  if ($('#dumps').style.display !== 'none') renderDumps();
  hardRefresh();
});

renderDumpBtn(null);
loadWidths();
initResizers();
initAsideGrip();
collectStatics();
applyLang();
loadProcs();
refresh();
// Открытый канал - признак живого окна: по его закрытию сервер завершается.
// EventSource сам переподключается после перезагрузки страницы.
new EventSource('/api/alive');
setInterval(loadProcs, 2500);
setInterval(refresh, 1000);
</script>
</body>
</html>
