[package]
name = "sockettrail"
version = "0.1.0"
edition = "2024"
description = "Монитор сетевых соединений с привязкой к процессу, включая приложения под Proton и Wine"
license = "MIT"
repository = "https://github.com/mazixs/SocketTrail"
readme = "README.md"
keywords = ["network", "monitor", "proton", "pcap", "linux"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Time", "Win32_System_Kernel", "Wdk_System_Threading"] }

[build-dependencies]
winresource = "0.1.31"
