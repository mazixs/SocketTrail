[package]
name = "sockettrail"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Network connection monitor tied to processes, including applications under Proton and Wine"
license = "MIT"
repository = "https://github.com/mazixs/SocketTrail"
readme = "README.md"
keywords = ["network", "monitor", "proton", "pcap", "linux"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"] }
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Time", "Win32_System_Kernel", "Win32_System_Diagnostics_Etw", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_Shell", "Wdk_System_Threading"] }

[build-dependencies]
winresource = "0.1.31"
